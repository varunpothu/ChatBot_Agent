name: AI Quality Gate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-quality:
    name: Unit, quality and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Dependency consistency
        run: pip check
      - name: Unit tests
        run: pytest -q -m "not integration"
      - name: Deterministic retrieval and grounding gate
        run: python -m evaluation.ci_gate
      - name: Quality benchmark
        run: python -m evaluation.benchmark
      - name: Compile
        run: python -m compileall agents rag knowledge monitoring governance evaluation ai_controls voice storage infra workers apps

  integration:
    name: PostgreSQL/Redis integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coachai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coachai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/coachai
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Integration tests
        run: pytest -m integration -q

  package-smoke:
    name: Packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Inspect artifacts
        run: ls -lah dist

  terraform-check:
    name: Terraform syntax and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
      - name: Terraform format
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init without backend
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  container-smoke:
    name: Container build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --pull -t coachai-ci:${{ github.sha }} .
