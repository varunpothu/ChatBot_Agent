[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coachai-rag"
version = "1.2.0"
description = "Production-oriented, low-cost grounded RAG coaching-centre assistant with governed ingestion, multilingual retrieval, voice, evaluation and human oversight"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "boto3>=1.35,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "beautifulsoup4>=4.12,<5",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "rank-bm25>=0.2,<1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "redis>=5,<7",
]

[project.optional-dependencies]
multilingual = [
  "sentence-transformers>=3,<6",
]
voice = [
  "amazon-transcribe>=0.6,<1",
]

[project.scripts]
coachai-multilingual-benchmark = "scripts.benchmark_multilingual:main"
coachai-ingestion-worker = "workers.ingestion_worker:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
